name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 0.1.0)'
        required: true
      alias:
        description: 'Alias (stable, dev, etc.)'
        required: false
        default: 'stable'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mkdocs-material mike
          pip install -e book/

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Manual deployment (workflow_dispatch)
      - name: Deploy manual version
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd book
          mike deploy --push --update-aliases ${{ inputs.version }} ${{ inputs.alias }}

      # Dev deployment on push to main
      - name: Deploy dev docs
        if: github.event_name == 'push'
        run: |
          cd book
          mike deploy --push dev

      # Release deployment
      - name: Deploy release docs
        if: github.event_name == 'release'
        run: |
          cd book
          VERSION=${GITHUB_REF#refs/tags/v}
          mike deploy --push --update-aliases $VERSION stable
          mike set-default --push stable

      # The documented install command is
      #   curl -sSL https://desilang.org/install.sh | sh
      # so the script has to exist at the site root. mike publishes each
      # version into its own directory and leaves only a redirect at the
      # root, so nothing puts them there by default.
      #
      # Copied from the source commit rather than duplicated into book/docs,
      # so the published installer cannot drift from the committed one.
      - name: Publish installers at the site root
        run: |
          set -e
          mkdir -p /tmp/installers
          cp install.sh install.ps1 /tmp/installers/
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/installers/install.sh /tmp/installers/install.ps1 .
          git add install.sh install.ps1
          if git diff --cached --quiet; then
            echo "installers unchanged"
          else
            git commit -m "chore(site): publish installers at root"
            git push origin gh-pages
          fi
