name: CI

on:
  push:
    # Release work happens on dev-* branches, so they have to be gated too:
    # gating only main is what let a missing <stdint.h> (broke the MSVC build)
    # and %ld printing i64 as -1 reach dev-0.1.0 unnoticed.
    branches: [main, 'dev-**']
  pull_request:
    branches: [main, 'dev-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Both optimization levels on every platform: -O2 exploits invalid IR
    # that -O0 tolerates, so the release leg catches miscompiles the debug
    # leg hides (jmp_buf alignment, folded setjmp slots, frame-pointer
    # omission were all found this way).
    name: ${{ matrix.os }} / ${{ matrix.opt }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        opt: [debug, release]
    runs-on: ${{ matrix.os }}
    env:
      DESI_RELEASE: ${{ matrix.opt == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build compiler
        run: go build -ldflags="-s -w" ./...

      # Opt level does not affect the Go unit tests; run them once.
      - name: Run Go tests
        if: matrix.opt == 'debug'
        run: go test ./...

      - name: Build runtime (unix)
        if: runner.os != 'Windows'
        run: make runtime

      - name: Run example tests (unix)
        if: runner.os != 'Windows'
        timeout-minutes: 90
        run: |
          make compiler
          ./test_examples.sh

      - name: Build runtime + tools (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1

      - name: Run example tests (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 60
        # 437-446 are db/ORM examples — the db runtime is not ported to
        # Windows yet (see docs/contributing/windows-build.md).
        # The parallel runner shards across processes; every test is a full
        # compile+link, so this is CPU bound and scales with the runner.
        run: |
          .\test_examples_parallel.ps1 -Range "0,436"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_examples_parallel.ps1 -Range "447,9999"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The example suite covers the compiler; this covers the other shipped
      # binaries (desirepl, desifmt, desilsp, desic init/run/test/build),
      # which had no automated coverage and were each broken in some way.
      - name: Smoke-test shipped tooling (windows)
        if: runner.os == 'Windows' && matrix.opt == 'debug'
        shell: pwsh
        timeout-minutes: 10
        run: .\tools\smoke.ps1

      - name: Run leak detection (macOS only)
        if: runner.os == 'macOS' && matrix.opt == 'debug'
        timeout-minutes: 5
        run: |
          # Run leak checks on a representative subset of examples
          LEAK_EXAMPLES=(
            examples/38_while_loop.desi
            examples/42_generics.desi
            examples/170_tuple_phase1.desi
            examples/304_match_edge_cases.desi
          )
          LEAK_FAIL=0
          for f in "${LEAK_EXAMPLES[@]}"; do
            if [ -f "$f" ]; then
              echo "--- Leak check: $(basename $f) ---"
              bash test_leaks.sh "$f" || LEAK_FAIL=1
            fi
          done
          if [ "$LEAK_FAIL" -ne 0 ]; then
            echo "⚠ Some leak checks reported issues (non-blocking)"
          fi

  benchmarks:
    # Guards benchmark *correctness*, not wall-clock. Shared CI runners are
    # too noisy for an absolute-time threshold to mean anything — a timing
    # gate here would flake and get ignored, which is worse than no gate.
    # What is deterministic is that each Desi benchmark must produce the
    # same output as its C counterpart; run_benchmarks.sh already detects
    # that and we promote the warning to a failure. Timings are uploaded
    # for humans to compare against benchmarks/README.md.
    name: benchmarks (ubuntu, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # run_benchmarks.sh reads max RSS from `/usr/bin/time -v`, which is the
      # GNU time binary — not the shell builtin — and is not guaranteed to be
      # present on the runner image.
      - name: Install GNU time
        run: |
          if ! [ -x /usr/bin/time ]; then
            sudo apt-get update
            sudo apt-get install -y time
          fi

      - name: Build runtime + compiler
        run: |
          make runtime
          make compiler

      - name: Run benchmarks (release)
        timeout-minutes: 30
        run: |
          set -o pipefail
          ./benchmarks/run_benchmarks.sh --release 2> bench.err | tee bench.out
          echo "--- stderr ---"
          cat bench.err
          if grep -q "output mismatch" bench.err; then
            echo "::error::A Desi benchmark produced different output than its C counterpart"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            bench.out
            bench.err
