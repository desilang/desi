name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build compiler
        run: go build -ldflags="-s -w" ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build runtime (unix only)
        if: runner.os != 'Windows'
        run: make runtime

      - name: Run example tests (unix only)
        if: runner.os != 'Windows'
        run: |
          make compiler
          ./test_examples.sh

      - name: Run leak detection (macOS only)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          # Run leak checks on a representative subset of examples
          LEAK_EXAMPLES=(
            examples/38_while_loop.desi
            examples/42_generics.desi
            examples/170_tuple_phase1.desi
            examples/304_match_edge_cases.desi
          )
          LEAK_FAIL=0
          for f in "${LEAK_EXAMPLES[@]}"; do
            if [ -f "$f" ]; then
              echo "--- Leak check: $(basename $f) ---"
              bash test_leaks.sh "$f" || LEAK_FAIL=1
            fi
          done
          if [ "$LEAK_FAIL" -ne 0 ]; then
            echo "⚠ Some leak checks reported issues (non-blocking)"
          fi
