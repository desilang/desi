name: CI

on:
  push:
    # Release work happens on dev-* branches, so they have to be gated too:
    # gating only main is what let a missing <stdint.h> (broke the MSVC build)
    # and %ld printing i64 as -1 reach dev-0.1.0 unnoticed.
    branches: [main, 'dev-**']
  pull_request:
    branches: [main, 'dev-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Both optimization levels on every platform: -O2 exploits invalid IR
    # that -O0 tolerates, so the release leg catches miscompiles the debug
    # leg hides (jmp_buf alignment, folded setjmp slots, frame-pointer
    # omission were all found this way).
    name: ${{ matrix.os }} / ${{ matrix.opt }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        opt: [debug, release]
    runs-on: ${{ matrix.os }}
    env:
      DESI_RELEASE: ${{ matrix.opt == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build compiler
        run: go build -ldflags="-s -w" ./...

      # Opt level does not affect the Go unit tests; run them once.
      - name: Run Go tests
        if: matrix.opt == 'debug'
        run: go test ./...

      - name: Build runtime (unix)
        if: runner.os != 'Windows'
        run: make runtime

      # Start the PostgreSQL and MySQL that ship with the Ubuntu runner image,
      # so the "# REQUIRES: database" examples actually run somewhere. Done as
      # a step rather than with `services:`, because services attach to the
      # whole job and this one also runs on macOS and Windows, where Linux
      # containers are unavailable.
      - name: Start databases (linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql || sudo service postgresql start
          sudo systemctl start mysql      || sudo service mysql start
          sleep 5
          # Password auth over TCP for both, matching what the examples connect with.
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'desi_test';"
          HBA=$(sudo -u postgres psql -tAc 'SHOW hba_file;')
          echo "host all all 127.0.0.1/32 md5" | sudo tee -a "$HBA" > /dev/null
          echo "host all all ::1/128 md5"      | sudo tee -a "$HBA" > /dev/null
          sudo systemctl restart postgresql || sudo service postgresql restart
          sleep 5
          # The runner image's MySQL root credential is not stable across image
          # revisions — it was socket auth, and is now a password. Discover it
          # instead of assuming, so an image bump stops breaking this job.
          root_opt=""
          found=0
          for opt in "" "-proot" "-pdesi_test"; do
            if sudo mysql $opt -e "SELECT 1" >/dev/null 2>&1; then
              root_opt="$opt"; found=1; break
            fi
          done
          if [ "$found" != "1" ]; then
            echo "could not authenticate to MySQL as root"; exit 1
          fi
          sudo mysql $root_opt -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'desi_test';"
          sudo mysql -pdesi_test -e "CREATE DATABASE IF NOT EXISTS desi_test;"
          PGPASSWORD=desi_test psql -h 127.0.0.1 -U postgres -d postgres -c "select version();"
          mysql -h 127.0.0.1 -u root -pdesi_test -e "select version();"

      # macOS runners have neither server running, so install and start them.
      # A second platform of real database coverage is worth the install time:
      # the drivers speak the wire protocols directly, so a byte-order or
      # struct-packing mistake would only ever show up against a live server.
      #
      # mysql@8.0 rather than the default formula: 9.x removed
      # mysql_native_password, and the caching_sha2_password fallback needs a
      # TLS channel for its first (uncached) handshake, which the runner's
      # OpenSSL availability does not guarantee.
      #
      # continue-on-error, and the test step reads `ready` below: a Homebrew
      # hiccup should cost the database coverage on this leg, not the whole
      # build. When it does not come up the suite still runs, just without the
      # database examples, and the skip is visible in the log.
      - name: Start databases (macos)
        id: macdb
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set -e
          brew install postgresql@16 mysql@8.0
          export PATH="$(brew --prefix postgresql@16)/bin:$(brew --prefix mysql@8.0)/bin:$PATH"
          brew services start postgresql@16
          brew services start mysql@8.0
          # Wait for both to accept TCP rather than guessing at a sleep.
          for i in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1 && break || sleep 2
          done
          for i in $(seq 1 60); do
            mysqladmin -h 127.0.0.1 -u root ping >/dev/null 2>&1 && break || sleep 2
          done
          # Homebrew's postgres makes a superuser named after the current user,
          # not "postgres" — create the role the examples connect as.
          createuser -s postgres || true
          psql -d postgres -c "ALTER USER postgres WITH PASSWORD 'desi_test';"
          mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'desi_test';"
          mysql -u root -pdesi_test -e "CREATE DATABASE IF NOT EXISTS desi_test;"
          PGPASSWORD=desi_test psql -h 127.0.0.1 -U postgres -d postgres -c "select version();"
          mysql -h 127.0.0.1 -u root -pdesi_test -e "select version();"
          echo "ready=1" >> "$GITHUB_OUTPUT"

      # Linux always has servers; macOS runs the database examples only when
      # the step above actually brought them up.
      - name: Run example tests (unix)
        if: runner.os != 'Windows'
        timeout-minutes: 90
        env:
          DESI_DB_TESTS: ${{ (runner.os == 'Linux' || steps.macdb.outputs.ready == '1') && '1' || '0' }}
          PG_HOST: 127.0.0.1
          PG_USER: postgres
          PG_PASS: desi_test
          PG_DB: postgres
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASS: desi_test
          MYSQL_DB: desi_test
        run: |
          make compiler
          ./test_examples.sh

      - name: Build runtime + tools (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1

      - name: Run example tests (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 60
        # One range, not two: 437-446 used to be skipped because the db runtime
        # did not build on Windows. It does now, so the ORM examples run here
        # like everywhere else. The ones needing a live server still gate
        # themselves on DESI_DB_TESTS, which is unset on this leg.
        # The parallel runner shards across processes; every test is a full
        # compile+link, so this is CPU bound and scales with the runner.
        run: |
          .\test_examples_parallel.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The example suite covers the compiler; this covers the other shipped
      # binaries (desirepl, desifmt, desilsp, desic init/run/test/build),
      # which had no automated coverage and were each broken in some way.
      - name: Smoke-test shipped tooling (windows)
        if: runner.os == 'Windows' && matrix.opt == 'debug'
        shell: pwsh
        timeout-minutes: 10
        run: .\tools\smoke.ps1

      - name: Run leak detection (macOS only)
        if: runner.os == 'macOS' && matrix.opt == 'debug'
        timeout-minutes: 5
        run: |
          # Run leak checks on a representative subset of examples
          LEAK_EXAMPLES=(
            examples/38_while_loop.desi
            examples/42_generics.desi
            examples/170_tuple_phase1.desi
            examples/304_match_edge_cases.desi
          )
          LEAK_FAIL=0
          for f in "${LEAK_EXAMPLES[@]}"; do
            if [ -f "$f" ]; then
              echo "--- Leak check: $(basename $f) ---"
              bash test_leaks.sh "$f" || LEAK_FAIL=1
            fi
          done
          if [ "$LEAK_FAIL" -ne 0 ]; then
            echo "⚠ Some leak checks reported issues (non-blocking)"
          fi

  benchmarks:
    # Guards benchmark *correctness*, not wall-clock. Shared CI runners are
    # too noisy for an absolute-time threshold to mean anything — a timing
    # gate here would flake and get ignored, which is worse than no gate.
    # What is deterministic is that each Desi benchmark must produce the
    # same output as its C counterpart; run_benchmarks.sh already detects
    # that and we promote the warning to a failure. Timings are uploaded
    # for humans to compare against benchmarks/README.md.
    name: benchmarks (ubuntu, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # run_benchmarks.sh reads max RSS from `/usr/bin/time -v`, which is the
      # GNU time binary — not the shell builtin — and is not guaranteed to be
      # present on the runner image.
      - name: Install GNU time
        run: |
          if ! [ -x /usr/bin/time ]; then
            sudo apt-get update
            sudo apt-get install -y time
          fi

      - name: Build runtime + compiler
        run: |
          make runtime
          make compiler

      - name: Run benchmarks (release)
        timeout-minutes: 30
        run: |
          set -o pipefail
          ./benchmarks/run_benchmarks.sh --release 2> bench.err | tee bench.out
          echo "--- stderr ---"
          cat bench.err
          if grep -q "output mismatch" bench.err; then
            echo "::error::A Desi benchmark produced different output than its C counterpart"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            bench.out
            bench.err
