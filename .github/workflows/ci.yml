name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build compiler
        run: go build -ldflags="-s -w" ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build runtime (unix only)
        if: runner.os != 'Windows'
        run: make runtime

      - name: Run example tests (unix only)
        if: runner.os != 'Windows'
        run: |
          make compiler
          ./test_examples.sh
