<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Desi Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#0d1117 100%);color:#c9d1d9;height:100vh;display:flex;justify-content:center;align-items:center}
.chat{width:500px;max-height:92vh;background:#161b22;border:1px solid #30363d;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.hdr{padding:16px 20px;background:linear-gradient(90deg,#238636,#2ea043);display:flex;align-items:center;gap:10px}
.hdr h1{font-size:18px;color:#fff;font-weight:600}
.hdr .b{font-size:11px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:8px;color:#fff}
#st{padding:8px 20px;font-size:13px;color:#8b949e;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:6px}
#st .dot{width:8px;height:8px;border-radius:50%;background:#f85149;transition:background .3s}
#st.on .dot{background:#3fb950}
#log{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-height:350px}
.m{padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.5;max-width:85%;animation:fi .2s;word-wrap:break-word}
.m.sys{align-self:center;background:#21262d;color:#8b949e;font-size:12px;border-radius:16px;padding:4px 14px}
.m.bot{align-self:flex-start;background:linear-gradient(135deg,#1f3a5f,#1a2744);color:#58a6ff;border:1px solid #1f3a5f}
.m.oth{align-self:flex-start;background:#21262d;color:#c9d1d9}
.m.me{align-self:flex-end;background:#238636;color:#fff}
.ia{padding:12px 16px;border-top:1px solid #21262d;display:flex;gap:8px}
input{flex:1;padding:10px 14px;border:1px solid #30363d;border-radius:10px;background:#0d1117;color:#c9d1d9;font-size:14px;outline:none}
input:focus{border-color:#58a6ff}
button{padding:10px 20px;background:#238636;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#2ea043}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
#log::-webkit-scrollbar{width:6px}
#log::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
#tk{padding:6px 20px;font-size:11px;color:#484f58;border-top:1px solid #21262d;text-align:center}
</style>
</head>
<body>
<div class='chat'>
  <div class='hdr'><h1>Desi Chat</h1><span class='b'>Real-time</span></div>
  <div id='st'><span class='dot'></span><span id='stx'>Connecting...</span></div>
  <div id='log'></div>
  <div class='ia'>
    <form id='f' style='display:flex;gap:8px;flex:1'>
      <input id='i' placeholder='Type a message...' autocomplete='off'>
      <button type='submit'>Send</button>
    </form>
  </div>
  <div id='tk'>Waiting for server...</div>
</div>
<script>
var s=document.getElementById('st'),sx=document.getElementById('stx'),
    lg=document.getElementById('log'),tk=document.getElementById('tk'),
    uid=null,tc=0;

function add(t,c){
  var d=document.createElement('div');
  d.className='m '+c;
  d.textContent=t;
  lg.appendChild(d);
  lg.scrollTop=lg.scrollHeight;
}

var ws=new WebSocket('ws://'+location.host+'/ws');

ws.onopen=function(){
  s.className='on';s.id='st';
  sx.textContent='Connected';
  add('Connected to chat!','sys');
  ws.send('/hello');
  setInterval(function(){if(ws.readyState===1){tc++;ws.send('/time')}},8000);
};

ws.onmessage=function(e){
  var m=e.data;
  if(m.indexOf('Server is alive')>-1){tk.textContent=m+' | tick #'+tc;return}
  if(m.indexOf('joined')>-1||m.indexOf('left')>-1){add(m,'sys')}
  else if(m.indexOf('Hello from')>-1||m.indexOf('pong')>-1){add(m,'bot')}
  else{
    var i=m.indexOf(': ');
    if(i>0&&m.indexOf('User ')===0){
      var id=m.substring(5,i);
      if(!uid)uid=id;
      add(m,id===uid?'me':'oth');
    }else{add(m,'sys')}
  }
};

ws.onerror=function(){sx.textContent='Error'};
ws.onclose=function(){sx.textContent='Disconnected';add('Disconnected','sys')};

document.getElementById('f').onsubmit=function(e){
  e.preventDefault();
  var m=document.getElementById('i');
  if(m.value&&ws.readyState===1){ws.send(m.value);m.value=''}
};
</script>
</body>
</html>
