site_name: The Desi Book
site_description: Learn the Desi Programming Language - A modern, Python-inspired systems language
site_author: Desi Team
site_url: https://desilang.org

# Repository
repo_url: https://github.com/desilang/desi
repo_name: desilang/desi

# Theme configuration
theme:
  name: material
  custom_dir: overrides
  
  # Features
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  
  # Saffron/Bhagwa color palette (Sanatan Dharma)
  palette:
    # Light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Icons
  icon:
    repo: fontawesome/brands/github

# Custom CSS for exact saffron colors
extra_css:
  - stylesheets/saffron.css

# Versioning support with mike
extra:
  version:
    provider: mike
    default: stable
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/desilang/desi
      name: GitHub

# Open external links in new tab
extra_javascript:
  - javascripts/external-links.js

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/install.md
    - First Program: getting-started/first-program.md
    - Editor Setup: getting-started/editor-setup.md
  - Tutorials:
    - Introduction: tutorials/intro.md
    - Variables & Types: tutorials/variables.md
    - Functions: tutorials/functions.md
    - Collections: tutorials/collections.md
    - Classes: tutorials/classes.md
    - Generics: tutorials/generics.md
  - Language Guide:
    - Types: language/types.md
    - Control Flow: language/control-flow.md
    - Functions: language/functions.md
    - Lambda Functions: language/lambdas.md
    - Classes: language/classes.md
    - Generics: language/generics.md
    - Error Handling: language/error-handling.md
  - Reference:
    - Builtin Functions: reference/builtins.md
    - Operators: reference/operators.md
    - Keywords: reference/keywords.md
  - Examples: examples/index.md
  - Changelog: changelog.md

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Plugins
plugins:
  - search
